# Phase 0: prove the HA iOS app (pinned to release 2026.9.2, the last one built with Xcode 26.x) compiles on a
# free GitHub-hosted Mac. Produces an UNSIGNED .ipa artifact; signing happens later (Sideloadly or the paid account).
name: Build unsigned app

on:
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Local overrides (our bundle id, no team yet)
        run: |
          cat > Configuration/HomeAssistant.overrides.xcconfig <<'EOF'
          BUNDLE_ID_PREFIX = uk.supersalad
          DEVELOPMENT_TEAM =
          EOF

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project HomeAssistant.xcodeproj -scheme App-Release

      - name: Archive (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HomeAssistant.xcodeproj \
            -scheme App-Release \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*deprecated|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/App.xcarchive/Products/Applications"

      - name: Package .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP"/App.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry ../HomeApp-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HomeApp-unsigned
          path: ${{ runner.temp }}/HomeApp-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
